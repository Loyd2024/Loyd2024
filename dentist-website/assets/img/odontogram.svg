<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 30 492 572" width="492" height="572" role="img" aria-label="Adult dental chart, universal numbering: upper teeth 1 to 16, lower teeth 17 to 32">
<!-- Brightwater Dental odontogram (universal numbering). The home page inlines this same geometry so it follows the site theme. -->
<style>
.odo-tooth rect{fill:#fff;stroke:#3A2C8C;stroke-width:1.6}.odo-groove{fill:none;stroke:#3A2C8C;stroke-width:1.2;stroke-linecap:round;opacity:.45}
svg text.odo-num,svg .odo-labels text{font-family:'Spline Sans Mono',ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.odo-num{font-size:17px;fill:#554D72}.odo-side{font-size:18px;font-weight:600;fill:#3A2C8C}.odo-lab{font-size:15px;letter-spacing:.1em;text-transform:uppercase;fill:#554D72}.odo-range{font-size:22px;font-weight:600;fill:#3A2C8C}
.odo-mid{stroke:#8C83B0;stroke-width:1.3;stroke-dasharray:2 7;stroke-linecap:round}
@media (prefers-color-scheme:dark){.odo-tooth rect{fill:#1A1630;stroke:#C3B8FF}.odo-groove{stroke:#C3B8FF}.odo-num,.odo-lab{fill:#B6AFD2}.odo-side,.odo-range{fill:#B8ACFF}.odo-mid{stroke:#7A71A8}}
</style>
<g class="odo-labels">
<line class="odo-mid" x1="78" y1="315" x2="442" y2="315"/>
